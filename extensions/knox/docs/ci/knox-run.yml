# Example: knox run on pull requests

Copy into a consuming repo. This workflow is **not** enabled in KnoxCoder CI
(it needs a model key). Set `KNOX_API_KEY` as a repository secret.

```yaml
name: Knox review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  knox:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Knox CLI
        run: npm i -g @knoxchat/cli
        # Until the package is on the public registry, build from this repo:
        #   cd extensions/knox && npm run build:cli && npm i -g ./cli
      - name: Review
        run: |
          knox doctor
          knox run --json --permission acceptEdits "Review this PR and comment on risks."
        env:
          KNOX_API_KEY: ${{ secrets.KNOX_API_KEY }}
```

Notes:

- Default permission is Edits: file edits auto-apply, shell is denied unless `--permission fullAuto`.
- Repo hooks are ignored unless `--trust-hooks` or `KNOX_TRUST_WORKSPACE_HOOKS=1`.
- `--json` / `--stream-json` include `schemaVersion: 1` (see `docs/cli.md`).
