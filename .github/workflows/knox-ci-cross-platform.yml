# Knox checks on Windows and macOS (the Linux run lives in knox-ci.yml and gates packaging).
#
# Windows shells, path separators, PTY, and worktrees differ from Linux, and macOS has no packaging CI,
# so these are run separately. This workflow is NOT called by build-desktop.yml yet: once it has been
# green for several runs, fold the matrix into knox-ci.yml so it gates packaging too (v2-impl.md, P0-2).
name: Knox CI (Windows, macOS)

on:
  pull_request:
    paths:
      - 'extensions/knox/**'
      - 'src/vs/workbench/contrib/knox/**'
      - '.github/workflows/knox-ci-cross-platform.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/knox/**'
      - 'src/vs/workbench/contrib/knox/**'
      - '.github/workflows/knox-ci-cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knox-ci-xplat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knox:
    name: Knox tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/knox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild sqlite3
        working-directory: extensions/knox
        run: npm rebuild sqlite3 --build-from-source

      - name: Git identity for hermetic test repos
        run: |
          git config --global user.email ci@knox.dev
          git config --global user.name "Knox CI"
          git config --global core.autocrlf false

      - name: Type-check core
        working-directory: extensions/knox
        run: npm run test:tsc

      - name: Core tests
        working-directory: extensions/knox
        run: npm run test:core

      - name: Pkg tests
        working-directory: extensions/knox
        run: npm run test:pkg

      - name: Inventory gate
        working-directory: extensions/knox
        run: npm run inventory-gate
