# Nightly Knox regression run: the scripted eval suite (golden, systems, rust, honesty)
# and the memory benchmark. Live-model runs need a signed-in Knox OAuth session
# (`~/.knoxcoder/auth.json`) and stay local (`cd extensions/knox && npm run test:live`).
# No KNOX_API_KEY. Trend files go to eval/results/history.jsonl.
name: Knox Nightly

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Scripted evals and memory bench
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/knox/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python-is-python3 \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev
      # Electron 43 / Node 24 headers do not compile with GCC 11 (ubuntu-22.04 default).
      # The ubuntu-toolchain-r/test PPA is too flaky (Launchpad 503s) and also upgrades
      # libstdc++. Clang 15 is preinstalled on the runner and accepts the same headers.
      - name: Use Clang 15 for native modules
        run: |
          if ! command -v clang++-15 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-15
          fi
          clang++-15 --version
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Rebuild sqlite3 against runner glibc
        working-directory: extensions/knox
        run: npm rebuild sqlite3 --build-from-source
      - name: Git identity for hermetic test repos
        run: |
          git config --global user.email ci@knox.dev
          git config --global user.name "Knox Nightly"
      - name: Scripted evals (both loop paths)
        working-directory: extensions/knox
        run: npx vitest run --config src/core/vitest.config.ts eval --reporter=default --reporter=json --outputFile=eval-results.json
      - name: Memory benchmark
        working-directory: extensions/knox
        run: npx vitest run --config src/core/vitest.config.ts context/memory/bench
      - name: Summary
        if: always()
        working-directory: extensions/knox
        run: |
          node -e "const r=require('./eval-results.json');console.log('## Knox nightly eval\n\n'+r.numPassedTests+'/'+r.numTotalTests+' passed, '+r.numFailedTests+' failed')" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: knox-eval-results
          path: extensions/knox/eval-results.json
