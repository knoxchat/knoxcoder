# Knox checks: core + pkg vitest, core type-check, and the inventory gate.
# Runs on pull requests and branch pushes, and is called by build-desktop.yml so packaging is blocked on it.
#
# Matrix: Linux and Windows (macOS is built/tested locally). GUI/contract tests stay Linux-only (xvfb + Electron).
name: Knox CI

on:
  pull_request:
    paths:
      - 'extensions/knox/**'
      - 'src/vs/workbench/contrib/knox/**'
      - '.github/workflows/knox-ci.yml'
      - 'scripts/ci/generate-update-metadata.mjs'
      - 'scripts/ci/generate-update-metadata.test.mjs'
      - 'scripts/ci/release-check.mjs'
      - 'scripts/ci/release-check.test.mjs'
  push:
    branches: [main]
    paths:
      - 'extensions/knox/**'
      - 'src/vs/workbench/contrib/knox/**'
      - '.github/workflows/knox-ci.yml'
      - 'scripts/ci/generate-update-metadata.mjs'
      - 'scripts/ci/generate-update-metadata.test.mjs'
      - 'scripts/ci/release-check.mjs'
      - 'scripts/ci/release-check.test.mjs'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: knox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knox:
    name: Knox tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS 2022), same as the x64 packaging job: windows-latest ships VS 18,
        # which node-gyp 11 cannot find, so `npm ci` fails building native modules.
        os: [ubuntu-22.04, windows-2022]
    env:
      GYP_MSVS_VERSION: '2022'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/knox/package-lock.json

      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python-is-python3 \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: npm ci

      # `npm run` puts extensions/node_modules/.bin on PATH; make sure its typescript is really installed
      # (the root install can leave it missing on Windows), otherwise `tsc` resolves to a dangling shim.
      - name: Ensure extensions/ dependencies (typescript)
        if: startsWith(matrix.os, 'windows')
        working-directory: extensions
        run: |
          if [ ! -f node_modules/typescript/bin/tsc ]; then
            npm ci --ignore-scripts
          fi

      - name: Rebuild sqlite3
        working-directory: extensions/knox
        run: npm rebuild sqlite3 --build-from-source

      - name: Git identity for hermetic test repos
        run: |
          git config --global user.email ci@knox.dev
          git config --global user.name "Knox CI"
          git config --global core.autocrlf false

      - name: Type-check core
        working-directory: extensions/knox
        run: npm run test:tsc

      - name: Core tests
        working-directory: extensions/knox
        run: npm run test:core

      - name: Pkg tests
        working-directory: extensions/knox
        run: npm run test:pkg

      - name: Host unit tests
        working-directory: extensions/knox
        run: npm run test:host

      - name: Inventory gate
        working-directory: extensions/knox
        run: npm run inventory-gate

      - name: Packaged extension smoke
        working-directory: extensions/knox
        run: npm run esbuild -- --skip-native && npm run packaged-smoke

      - name: Update-feed checksums
        if: startsWith(matrix.os, 'ubuntu')
        run: node --test scripts/ci/generate-update-metadata.test.mjs scripts/ci/release-check.test.mjs

  # Knox GUI / contract tests run inside Electron (scripts/test.sh) under xvfb.
  # continue-on-error until it has been green for several runs (v2-impl.md, P0-1); then remove it so it gates packaging.
  gui:
    name: Knox GUI contract tests (Electron)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/knox/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python-is-python3 xvfb \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            libgtk-3-0 libnss3 libasound2 libgbm1

      - name: Install dependencies
        run: npm ci

      - name: Download Electron
        run: npm run electron

      - name: Transpile client
        run: npm run transpile-client

      - name: Knox GUI tests
        run: xvfb-run -a ./scripts/test.sh --glob "vs/workbench/contrib/knox/**/*.test.js"
