# Cross-platform desktop builds for KnoxCoder: Linux (tar.gz, deb, rpm) and Windows (zip, system + user installers).
#
# Every format wraps the same application tree, so building all of them roughly triples the size of
# the uploaded artifacts. Manual runs therefore build only the tar.gz (Linux) and zip (Windows) unless
# "all_packages" is ticked. "publish_release" and "all_packages" always build every format.
#
# macOS is intentionally NOT built here. It is built and signed locally with ./build_dmg.sh.
#
# Triggers
#   - Manual only (Actions -> "Build desktop apps" -> Run workflow). Tick "arm64" to also build
#     the arm64 targets. Tag pushes and branch pushes do not start this workflow.
#
# The gulp tasks below are the same ones the local macOS build uses (`vscode-<platform>-<arch>-min`);
# output lands in ../VSCode-<platform>-<arch> next to the checkout, exactly like build_dmg.sh expects.
# After packaging, scripts/ci/mix-in-cli.sh builds the Rust tunnel CLI (knoxcoder-tunnel)
# into that tree so Linux deb/rpm dependency generation and Windows installers include it.

name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Also build Linux arm64 (ubuntu-22.04-arm) and Windows arm64 (windows-11-arm)'
        type: boolean
        default: false
      publish_release:
        description: Attach the artifacts to a draft GitHub release for the current version (implies all_packages)
        type: boolean
        default: false
      all_packages:
        description: Also build Linux deb/rpm and the Windows system/user installers (roughly triples artifact size)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lets the builtin-extension and sysroot downloads avoid anonymous GitHub API rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm_config_fund: 'false'
  npm_config_audit: 'false'
  # 'true' for release-style runs (publish_release, all_packages); otherwise only tar.gz / zip are built.
  FULL_PACKAGES: ${{ inputs.publish_release || inputs.all_packages }}

jobs:
  knox-ci:
    name: Knox CI
    uses: ./.github/workflows/knox-ci.yml

  matrix:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - id: plan
        env:
          ARM64: ${{ inputs.arm64 }}
        run: |
          linux='[{"arch":"x64","runner":"ubuntu-22.04"}'
          windows='[{"arch":"x64","runner":"windows-2022"}'
          if [ "$ARM64" = "true" ]; then
            linux="$linux"',{"arch":"arm64","runner":"ubuntu-22.04-arm"}'
            windows="$windows"',{"arch":"arm64","runner":"windows-11-arm"}'
          fi
          echo "linux=$linux]" >> "$GITHUB_OUTPUT"
          echo "windows=$windows]" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: [matrix, knox-ci]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.linux) }}
    # ubuntu-22.04 (glibc 2.35) keeps the binaries runnable on a wider range of distributions than a newer image would.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python-is-python3 \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libgbm1 libgtk-3-0 \
            libdbus-1-dev fakeroot dpkg-dev rpm

      # Electron 43 headers (V8 14) do not compile with GCC 11 (ubuntu-22.04 default); use GCC 13.
      - name: Use GCC 13 for native modules
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          if command -v cargo >/dev/null 2>&1; then
            cargo --version
            exit 0
          fi
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cli-${{ hashFiles('cli/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run gulp vscode-linux-${{ matrix.arch }}-min

      - name: Mix in tunnel CLI
        env:
          VSCODE_ARCH: ${{ matrix.arch }}
          VSCODE_PLATFORM: linux
        run: bash scripts/ci/mix-in-cli.sh

      - name: Package tar.gz
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          tar -czf "dist/KnoxCoder-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C .. "VSCode-linux-${{ matrix.arch }}"

      - name: Package deb
        if: ${{ env.FULL_PACKAGES == 'true' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-deb
          npm run gulp vscode-linux-${{ matrix.arch }}-build-deb
          deb="$(find .build/linux/deb -name '*.deb' | head -n 1)"
          test -n "$deb"
          cp "$deb" "dist/KnoxCoder-${VERSION}-linux-${{ matrix.arch }}.deb"

      - name: Package rpm
        if: ${{ env.FULL_PACKAGES == 'true' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-rpm
          npm run gulp vscode-linux-${{ matrix.arch }}-build-rpm
          rpm_file="$(find .build/linux/rpm -name '*.rpm' | head -n 1)"
          test -n "$rpm_file"
          cp "$rpm_file" "dist/KnoxCoder-${VERSION}-linux-${{ matrix.arch }}.rpm"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: knoxcoder-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14
          # tar.gz / deb / rpm / zip / exe are already compressed; re-deflating them only burns CI time.
          compression-level: 0

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [matrix, knox-ci]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Add Windows SDK signtool to PATH
        run: |
          $archDir = if ('${{ matrix.arch }}' -eq 'arm64') { 'arm64' } else { 'x64' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\${archDir}\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Host "signtool.exe not found; gulp will skip Authenticode stripping"
            return
          }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.Directory.FullName
          Write-Host "Using signtool at $($signtool.FullName)"

      - name: Install Rust
        run: |
          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            cargo --version
            return
          }
          $ProgressPreference = 'SilentlyContinue'
          $hostTriple = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $url = "https://static.rust-lang.org/rustup/dist/$hostTriple/rustup-init.exe"
          $installer = Join-Path $env:TEMP 'rustup-init.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          & $installer -y --profile minimal --default-toolchain stable --default-host $hostTriple
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cli-${{ hashFiles('cli/Cargo.lock') }}

      - name: Disable Spectre mitigation for native modules
        if: matrix.arch == 'arm64'
        run: |
          # windows-11-arm ships VS 18. Native modules set SpectreMitigation=Spectre
          # in binding.gyp. The toolset MSBuild then picks (v143 / 14.44) has no
          # lib\spectre\arm64, so the linker fails with LNK1181 delayimp.lib.
          # Directory.Build.targets is imported after the vcxproj, so it can both
          # clear SpectreMitigation (silences MSB8040) and prepend the plain
          # MSVC lib folder that actually contains delayimp.lib.
          $xml = @'
          <Project>
            <PropertyGroup>
              <SpectreMitigation>false</SpectreMitigation>
            </PropertyGroup>
            <ItemDefinitionGroup>
              <Link>
                <AdditionalLibraryDirectories>$(VCToolsInstallDir)lib\$(PlatformTarget);%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
              </Link>
            </ItemDefinitionGroup>
          </Project>
          '@
          $xml = ($xml -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $workspaceTargets = Join-Path $pwd 'Directory.Build.targets'
          $workspaceProps = Join-Path $pwd 'Directory.Build.props'
          $propsPath = Join-Path $env:RUNNER_TEMP 'DisableSpectre.props'
          [System.IO.File]::WriteAllText($workspaceTargets, $xml)
          [System.IO.File]::WriteAllText($workspaceProps, $xml)
          [System.IO.File]::WriteAllText($propsPath, $xml)
          Add-Content -Path $env:GITHUB_ENV -Value "ForceImportBeforeCppTargets=$propsPath"
          Add-Content -Path $env:GITHUB_ENV -Value "ForceImportAfterCppProps=$propsPath"
          Write-Host "Wrote $workspaceTargets"
          Write-Host "Wrote $workspaceProps"
          Write-Host "ForceImportBeforeCppTargets=$propsPath"

      - name: Install dependencies
        env:
          GYP_MSVS_VERSION: '2022'
        run: |
          # windows-11-arm currently ships Visual Studio 18. node-gyp 11 only
          # maps VS 15/16/17, so import vcvars and report VSCMD_VER as 17.0.
          # preinstall.ts also only looks for a 2019/2022 folder unless
          # vs2022_install points at the VS 18 install.
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $vcvars = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\18\*\VC\Auxiliary\Build\vcvarsall.bat' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $vcvars) {
              $vcvars = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvarsall.bat' -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }
            if (-not $vcvars) {
              throw 'vcvarsall.bat not found; cannot compile native modules on this runner'
            }
            $vsInstall = $vcvars.Directory.Parent.Parent.Parent.FullName
            Write-Host "Importing $($vcvars.FullName) arm64"
            Write-Host "vs2022_install=$vsInstall"
            $setup = Join-Path $env:TEMP 'knox-vcvars.cmd'
            @(
              '@echo off',
              "call `"$($vcvars.FullName)`" arm64",
              'set'
            ) | Set-Content -Path $setup
            & cmd.exe /c $setup | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              }
            }
            $env:VSCMD_VER = '17.0'
            $env:GYP_MSVS_VERSION = '2022'
            $env:vs2022_install = $vsInstall
            Add-Content -Path $env:GITHUB_ENV -Value "vs2022_install=$vsInstall"
            Add-Content -Path $env:GITHUB_ENV -Value "GYP_MSVS_VERSION=2022"
            Add-Content -Path $env:GITHUB_ENV -Value "VSCMD_VER=17.0"
          }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build app
        run: |
          npm run gulp vscode-win32-${{ matrix.arch }}-min
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gulp vscode-win32-${{ matrix.arch }}-inno-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mix in tunnel CLI
        shell: bash
        env:
          VSCODE_ARCH: ${{ matrix.arch }}
          VSCODE_PLATFORM: win32
        run: bash scripts/ci/mix-in-cli.sh

      - name: Package zip
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force dist | Out-Null
          $source = Join-Path (Split-Path -Parent $PWD.Path) "VSCode-win32-${{ matrix.arch }}"
          7z a -tzip -mx=5 "dist/KnoxCoder-$version-win32-${{ matrix.arch }}.zip" "$source\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installers
        if: ${{ env.FULL_PACKAGES == 'true' }}
        run: |
          $version = node -p "require('./package.json').version"
          foreach ($target in 'system', 'user') {
            npm run gulp vscode-win32-${{ matrix.arch }}-$target-setup
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installer = Get-ChildItem ".build/win32-${{ matrix.arch }}/$target-setup" -Filter *.exe | Select-Object -First 1
            if (-not $installer) { throw "No $target installer produced" }
            Copy-Item $installer.FullName "dist/KnoxCoder-$version-win32-${{ matrix.arch }}-$target-setup.exe"
          }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: knoxcoder-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14
          # tar.gz / deb / rpm / zip / exe are already compressed; re-deflating them only burns CI time.
          compression-level: 0

  release:
    name: Draft release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: knoxcoder-*
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lh release

      - name: Generate KnoxCoder update metadata
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/ci/generate-update-metadata.mjs \
            --assets-dir release \
            --out-dir release \
            --version "$VERSION" \
            --tag "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build.{1}', github.run_number, github.run_attempt) }}" \
            --commit "${{ github.sha }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build.{1}', github.run_number, github.run_attempt) }}
          name: KnoxCoder ${{ github.ref_name }}
          draft: true
          files: release/*
          fail_on_unmatched_files: true
